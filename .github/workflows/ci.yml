name: DSA-Mastery CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 13
        run: sudo apt-get install -y g++-13

      - name: Compile and test C++
        run: |
          g++-13 -std=c++20 -O2 -o test_cpp tests/cpp/test_sorting.cpp
          ./test_cpp
