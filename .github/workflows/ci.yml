name: DSA-Mastery Daily CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Fetches the current and previous commit so we can see what changed

      - name: Install GCC 13
        run: sudo apt-get install -y g++-13

      - name: Find, Compile, and Run Changed C++ Tests
        run: |
          # 1. Find any modified or added .cpp files in the tests/cpp/ directory from the latest push
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep 'tests/cpp/.*\.cpp$' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No C++ test files were changed in this push. Skipping compilation."
            exit 0
          fi

          # 2. Loop through the changed files, compile, and run them
          for FILE in $CHANGED_FILES; do
            echo "--------------------------------------------------"
            echo "Processing daily test: $FILE"
            
            # Extract a clean binary name (e.g., test_cpp_executable)
            EXE_NAME="test_daily_bin"
            
            # --- FIXED LINE BELOW ---
            # Added '-I tests' and '-I tests/cpp' flags so the compiler can resolve #include "test_common.hpp"
            g++-13 -std=c++20 -O2 -I tests -I tests/cpp -o "$EXE_NAME" "$FILE"
            
            # Run the test execution
            ./"$EXE_NAME"
          done
